"Access token + refresh token (Laravel Passport password grant), returned from login/refreshToken."
type AuthPayload {
    access_token: String!
    refresh_token: String!
    token_type: String!
    "Seconds until access_token expires."
    expires_in: Int!
}

type Mutation {
    "Register a new account, returning access_token/refresh_token immediately (auto-login after registration)."
    register(
        "Disallows '<' or '>' characters to prevent HTML/script injection (stored XSS)."
        name: String! @rules(apply: ["required", "max:255", "regex:/^[^<>]*$/"])
        "Handle (without '@'). Automatically generated if omitted."
        username: String @rules(apply: ["nullable", "App\\Rules\\Username"])
        email: String! @rules(apply: ["required", "email", "max:255", "unique:users,email"])
        password: String! @rules(apply: ["required", "min:8", "confirmed"])
        password_confirmation: String
        remember_me: Boolean = false
    ): AuthPayload! @throttle(name: "oauth-token")

    "Log in with email + password. remember_me=true: refresh_token valid for 30 days instead of 1 day."
    login(
        email: String! @rules(apply: ["required", "email"])
        password: String!
        remember_me: Boolean = false
    ): AuthPayload! @throttle(name: "oauth-token")

    "Obtain a new access_token from a refresh_token. Must resend remember_me=true to retain 30-day session."
    refreshToken(
        refresh_token: String!
        remember_me: Boolean = false
    ): AuthPayload! @throttle(name: "oauth-token")

    "Revoke the access token used for this request and its refresh tokens."
    logout: Boolean! @guard

    "Resend verification email if own email has not been verified yet."
    resendVerificationEmail: Boolean! @guard @throttle(name: "oauth-token")

    "Send password reset email if email exists. Always returns true to prevent account enumeration."
    forgotPassword(email: String! @rules(apply: ["required", "email"])): Boolean! @throttle(name: "oauth-token")

    "Set a new password using the token received via email from forgotPassword."
    resetPassword(
        email: String! @rules(apply: ["required", "email"])
        token: String!
        password: String! @rules(apply: ["required", "min:8"])
    ): Boolean! @throttle(name: "oauth-token")
}

"Username availability check result while typing."
type UsernameCheck {
    "Normalized handle (lowercase, stripped '@')."
    username: String!
    available: Boolean!
    "Reason unavailable; null if available."
    message: String
}

extend type Query {
    "Check whether a handle is available (registration / profile update). Public; if authenticated, caller's own current handle is considered available."
    usernameAvailable(username: String!): UsernameCheck! @throttle(name: "username-check")
}
