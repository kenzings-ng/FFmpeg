# All video fields require authentication — no video fields are public, so @guard
# is attached once here instead of repeating on each field.
extend type Query @guard {
    "List videos, newest first. Default (without mine) returns both public and own videos."
    videos(
        "true: only own videos (including private). false: only public videos. Omitted: both (default behavior)."
        mine: Boolean
    ): [Video!]! @paginate(scopes: ["viewableBy"], defaultCount: 10, maxCount: 50) @orderBy(column: "created_at", direction: DESC)
    video(id: ID! @eq): Video @canFind(ability: "view", find: "id") @find
}

extend type Mutation @guard {
    uploadVideo(
        "Disallows '<' or '>' characters to prevent HTML/script injection (stored XSS) when title is displayed on frontend."
        title: String! @rules(apply: ["required", "max:255", "regex:/^[^<>]*$/"])
        file: Upload! @rules(apply: ["file", "mimetypes:video/*", "max:2097152"])
        "Defaults to false (private). Owner can change later via setVideoVisibility."
        is_public: Boolean = false
    ): Video @throttle(name: "graphql-video")

    "Update video title. Owner only."
    updateVideo(
        id: ID!
        title: String! @rules(apply: ["required", "max:255", "regex:/^[^<>]*$/"])
    ): Video! @canFind(ability: "update", find: "id")

    "Video owner only can toggle private/public visibility."
    setVideoVisibility(id: ID!, is_public: Boolean!): Video! @canFind(ability: "update", find: "id")

    "Video owner only can retrigger video processing (e.g. after status = FAILED)."
    segmentVideo(id: ID!): Video! @canFind(ability: "update", find: "id") @throttle(name: "graphql-video")

    "Permanently delete video (both original and HLS files on disk). Owner only, irreversible."
    deleteVideo(id: ID!): Boolean! @canFind(ability: "delete", find: "id", model: "App\\Models\\Video")
}

enum VideoStatus {
    "Uploaded / resegment requested, waiting in queue."
    PENDING @enum(value: "pending")
    "ffmpeg is transcoding."
    PROCESSING @enum(value: "processing")
    "Completed, hls_url is playable."
    READY @enum(value: "ready")
    "Failed after exhausting all retry attempts. Call segmentVideo to retry."
    FAILED @enum(value: "failed")
}

type Video {
    id: ID!
    title: String!
    is_public: Boolean!
    status: VideoStatus!
    user: User! @belongsTo
    """
    Master playlist URL. Video stored locally: playable directly (static if public,
    signed with expiration if private). Video on CDN: requires stream token, see field stream.
    null when HLS is not yet available.
    """
    hls_url: String @method(name: "hlsUrl")
    "JPEG poster (preserves original aspect ratio, max long edge 960px). null if not yet available."
    poster_url: String @method(name: "posterUrl")
    "Streaming authorization for video on CDN (R2). null if video is not READY or stored locally."
    stream: VideoStream @method(name: "streamAccess")
    created_at: DateTime!
    updated_at: DateTime!
}

"""
Stream video from CDN: exchange grant for stream token via GET {token_url}?grant=…, then append
?token=… to all playlist / segment / AES key requests. Query this field again upon expiration.
"""
type VideoStream {
    "Master playlist on CDN."
    playlist_url: String!
    "CDN endpoint to exchange grant for stream token (bound to viewer IP subnet)."
    token_url: String!
    "Short-lived authorization grant (a few minutes), used exclusively to exchange for stream token."
    grant: String!
    "Unix timestamp (seconds) when grant expires."
    expires_at: Int!
}
