# Two-level YouTube-style comment threads on videos. Access permissions mirror
# video viewing permissions (VideoPolicy::view), see CommentPolicy.
#
# Body is raw text, ALLOWING '<' and '>' (e.g. "<3", "a < b"): Frontend renders
# via text interpolation, never using v-html.
#
# "@handle" in body represents mentions: on create / update, backend records mentioned
# users in comment_mentions (Comment::syncMentions).

extend type Query @guard {
    "A comment, used to paginate replies: comment(id) { replies(first, page) }. Requires view access to video."
    comment(id: ID! @eq): Comment @canFind(ability: "view", find: "id") @find

    """
    Autocomplete suggestions when typing "@" in a video comment: prior video commenters and video owner
    first, followed by other users matching handle prefix / name. Max 8, excludes caller.
    """
    mentionSuggestions(video_id: ID!, query: String): [User!]!
}

extend type Mutation @guard {
    """
    Post a root comment, or a reply if reply_to_id is provided. Replying to a reply remains
    in the root comment thread, with reply_to_user recorded to display "@Name".
    """
    createComment(
        video_id: ID!
        body: String! @rules(apply: ["required", "string", "max:2000"])
        "The comment being replied to (root or reply), must belong to the same video."
        reply_to_id: ID
    ): Comment! @throttle(name: "comment")

    "Update comment body. Author only."
    updateComment(
        id: ID!
        body: String! @rules(apply: ["required", "string", "max:2000"])
    ): Comment! @canFind(ability: "update", find: "id")

    "Delete comment (deleting a root comment deletes all replies). Author or video owner."
    deleteComment(id: ID!): Boolean! @canFind(ability: "delete", find: "id", model: "App\\Models\\Comment")
}

type Comment {
    id: ID!
    body: String!
    user: User! @belongsTo
    "User replied to when this is a reply to another reply; null otherwise."
    reply_to_user: User @belongsTo(relation: "replyToUser")
    "Root comment ID; null if this is a root comment."
    parent_id: ID
    "Reply count (meaningful for root comments)."
    replies_count: Int! @count(relation: "replies")
    "Replies, oldest first."
    replies: [Comment!]! @hasMany(type: PAGINATOR, defaultCount: 20, maxCount: 50)
    """
    Resolved mentions present in the comment body. Frontend replaces "@{handle}" in body with
    "@{user.username}" (current handle): if a user changes their handle, it resolves and links correctly.
    """
    mentions: [CommentMention!]! @hasMany
    "null if never edited."
    edited_at: DateTime
    created_at: DateTime!
}

extend type Video {
    "Total comments count, including replies."
    comments_count: Int! @count(relation: "comments")
    "Root comments, newest first."
    comments: [Comment!]! @hasMany(type: PAGINATOR, relation: "topLevelComments", defaultCount: 20, maxCount: 50)
}

"A mention in a comment."
type CommentMention {
    "Handle as originally written (without '@', lowercase) — matching the \"@handle\" in body."
    handle: String!
    "Mentioned user (current handle in user.username)."
    user: User! @belongsTo
}
