# Bình luận 2 tầng kiểu YouTube trên video. Quyền xem / viết bình luận đi theo
# quyền xem video (VideoPolicy::view), xem CommentPolicy.
#
# Nội dung là text thuần, CHO PHÉP chứa < > (vd. "<3", "a < b"): FE luôn hiển
# thị bằng text interpolation, không bao giờ dùng v-html.
#
# "@handle" trong nội dung là nhắc tên: lúc tạo / sửa, BE ghi người được nhắc
# vào comment_mentions (Comment::syncMentions).

extend type Query @guard {
    "Một bình luận, dùng để tải trả lời: comment(id) { replies(first, page) }. Cần xem được video chứa bình luận."
    comment(id: ID! @eq): Comment @canFind(ability: "view", find: "id") @find

    """
    Gợi ý khi gõ "@" trong bình luận của video: người đã bình luận video đó và chủ
    video trước, rồi tới người dùng khác khớp đầu handle / tên. Tối đa 8, không gồm chính mình.
    """
    mentionSuggestions(video_id: ID!, query: String): [User!]!
}

extend type Mutation @guard {
    """
    Viết bình luận gốc, hoặc trả lời nếu có reply_to_id. Trả lời một trả lời vẫn
    nằm trong luồng của bình luận gốc, kèm reply_to_user để hiện "@Tên".
    """
    createComment(
        video_id: ID!
        body: String! @rules(apply: ["required", "string", "max:2000"])
        "Bình luận đang được trả lời (gốc hoặc trả lời), phải thuộc cùng video."
        reply_to_id: ID
    ): Comment! @throttle(name: "comment")

    "Sửa nội dung. Chỉ người viết."
    updateComment(
        id: ID!
        body: String! @rules(apply: ["required", "string", "max:2000"])
    ): Comment! @canFind(ability: "update", find: "id")

    "Xóa bình luận (bình luận gốc thì xóa luôn mọi trả lời). Người viết hoặc chủ video."
    deleteComment(id: ID!): Boolean! @canFind(ability: "delete", find: "id", model: "App\\Models\\Comment")
}

type Comment {
    id: ID!
    body: String!
    user: User! @belongsTo
    "Người được trả lời khi đây là trả lời của một trả lời; null nếu không."
    reply_to_user: User @belongsTo(relation: "replyToUser")
    "Id bình luận gốc; null nếu chính nó là bình luận gốc."
    parent_id: ID
    "Số trả lời (chỉ có ý nghĩa với bình luận gốc)."
    replies_count: Int! @count(relation: "replies")
    "Trả lời, cũ nhất trước."
    replies: [Comment!]! @hasMany(type: PAGINATOR, defaultCount: 20, maxCount: 50)
    """
    Các lần nhắc tên có thật trong nội dung. FE thay "@{handle}" trong body bằng
    "@{user.username}" (handle hiện tại): người được nhắc đổi handle vẫn hiện và trỏ đúng người.
    """
    mentions: [CommentMention!]! @hasMany
    "null nếu chưa từng sửa."
    edited_at: DateTime
    created_at: DateTime!
}

extend type Video {
    "Tổng số bình luận, gồm cả trả lời."
    comments_count: Int! @count(relation: "comments")
    "Bình luận gốc, mới nhất trước."
    comments: [Comment!]! @hasMany(type: PAGINATOR, relation: "topLevelComments", defaultCount: 20, maxCount: 50)
}

"Một lần nhắc tên trong bình luận."
type CommentMention {
    "Handle như lúc viết (không '@', chữ thường) — đoạn \"@handle\" tương ứng trong body."
    handle: String!
    "Người được nhắc (handle hiện tại ở user.username)."
    user: User! @belongsTo
}
