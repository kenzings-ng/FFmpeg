"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID! @eq
    ): User @find @guard

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10, maxCount: 50) @guard

    """
    Channel page /@handle (without '@'). Handles changed within 14 days still resolve
    to the owner: compare user.username with requested handle to redirect to new URL.
    """
    userByUsername(username: String!): User @guard

    "The currently authenticated user."
    me: User! @auth @guard
}

extend type Mutation {
    "Update own profile (name, handle, bio, password). Omitted fields remain unchanged."
    updateProfile(
        name: String @rules(apply: ["max:255", "regex:/^[^<>]*$/"])
        "Bio on channel page, maximum 1000 characters. Empty string = clear bio."
        bio: String @rules(apply: ["nullable", "string", "max:1000"])
        "New handle (without '@'). Max 2 changes per 14 days; previous handle is reserved for 14 days."
        username: String @rules(apply: ["App\\Rules\\Username"])
        "Required when changing password to verify account ownership."
        current_password: String @rules(
            apply: ["required_with:password", "current_password:api"]
            messages: [
                { rule: "required_with", message: "Current password is required." }
                { rule: "current_password", message: "Current password is incorrect." }
            ]
        )
        password: String @rules(apply: ["min:8"])
    ): User! @guard
}

"Account of a person who utilizes this application."
type User {
    "Unique primary key."
    id: ID!

    "Display name, duplicates allowed."
    name: String!

    "Unique handle (without '@'), lowercase a-z 0-9 . _ — used for mentions in comments."
    username: String!

    "Email — only returned when viewing self (via me, or user(id) matching caller); null for other users."
    email: String @method(name: "emailForDisplay")

    "Email verification timestamp: only visible to self."
    email_verified_at: DateTime @method(name: "emailVerifiedAtForDisplay")

    "Bio on channel page (plain text). null if unset."
    bio: String

    "Count of public ready videos (displayed on channel page)."
    videos_count: Int! @count(relation: "publicVideos")

    "Public ready videos, newest first — Video tab of channel page."
    videos: [Video!]! @hasMany(type: PAGINATOR, relation: "publicVideos", defaultCount: 24, maxCount: 50)

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}
