name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'  # khớp server production; composer.lock cần PHP >= 8.4
          coverage: none

      - name: Validate composer.json and composer.lock
        # Không dùng --strict: arcanedev/log-viewer và arcanedev/support chưa có
        # bản stable cho Laravel 12, buộc phải khai báo 12.x-dev (chỉ là cảnh báo).
        run: composer validate

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Các bước khác nếu có (ví dụ như chạy PHPUnit, PHPStan, hoặc các công cụ khác)
